[package]
name = "segcam-motion"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "segcam's motion segmenter as an After Effects effect: overlay, mattes and the swarm collage"

# The rlib is the core (and what the CLI and tests link); the cdylib is the After Effects
# plugin, which bundle-mac.sh wraps into SegcamMotion.plugin.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
after-effects = "0.4.0"

[build-dependencies]
pipl = "0.1.1"

# cfgs the after-effects crate's `define_effect!` tests in our crate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(does_dialog)", "cfg(with_premiere)", "cfg(threaded_rendering)", "cfg(catch_panics)"] }
