name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install software Vulkan (lavapipe) for headless rendering
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p vfx-core --all-targets -- -D warnings

      - name: Tests (headless render, reference checks)
        env:
          WGPU_BACKEND: ${{ runner.os == 'Linux' && 'vulkan' || '' }}
        run: cargo test -p vfx-core

      # The segcam Motion example: its core is plain Rust, so it tests on every OS.
      - name: segcam Motion example (clippy, core checks)
        run: |
          cargo clippy -p segcam-motion --all-targets -- -D warnings
          cargo test -p segcam-motion

  # The After Effects / Premiere plugin: a universal .plugin bundle on macOS and an
  # .aex on Windows. Unsigned; signing needs the publisher's certificates.
  adobe-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Wrapper tests (pixel conversion, pipeline, Metal interop on macOS)
        run: cargo test -p vfx-adobe --lib

      # OpenFX and FFGL: unit tests, then each plugin in its minimal host. The OpenFX
      # host needs the OpenFX headers (from the official repository); the FFGL host
      # needs an OpenGL context, which macOS runners provide.
      - name: OpenFX and FFGL wrapper tests
        if: runner.os == 'macOS'
        run: |
          cargo test -p vfx-wrapper-common -p vfx-ofx -p vfx-ffgl
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openfx.git "$RUNNER_TEMP/openfx"
          OFX_INCLUDE="$RUNNER_TEMP/openfx/include" ./wrappers/ofx/minihost/run.sh
          ./wrappers/ffgl/minihost/run.sh

      - name: Build macOS bundle and installer
        if: runner.os == 'macOS'
        run: |
          ./wrappers/adobe/package-mac.sh
          ./examples/segcam-motion/package-mac.sh

      - name: Build Windows .aex
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build -p vfx-adobe -p segcam-motion --release
          mkdir -p target/vfx-plugin
          cp target/release/vfx_adobe.dll target/vfx-plugin/VfxAdobe.aex
          cp target/release/segcam_motion.dll target/vfx-plugin/SegcamMotionRust.aex

      # OpenFX on Windows: the same unit tests and mini host as on macOS, the host built
      # with the runner's clang, then the bundle for Resolve and other OpenFX hosts.
      - name: OpenFX wrapper tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test -p vfx-wrapper-common -p vfx-ofx
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openfx.git "$RUNNER_TEMP/openfx"
          CC=clang OFX_INCLUDE="$RUNNER_TEMP/openfx/include" ./wrappers/ofx/minihost/run.sh

      - name: Build Windows OpenFX bundle
        if: runner.os == 'Windows'
        shell: bash
        run: ./wrappers/ofx/bundle-win.sh

      - name: FFGL wrapper tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p vfx-ffgl

      # The Windows FFGL mini host runs locally only; runners have no OpenGL 4.1 GPU.
      - name: Build Windows FFGL DLL
        if: runner.os == 'Windows'
        shell: bash
        run: ./wrappers/ffgl/bundle-win.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vfx-plugins-${{ runner.os }}
          path: |
            target/vfx-plugin/VfxAdobe.pkg
            target/vfx-plugin/VfxAdobe.plugin
            target/vfx-plugin/VfxAdobe.aex
            target/vfx-plugin/SegcamMotionRust.pkg
            target/vfx-plugin/SegcamMotionRust.plugin
            target/vfx-plugin/SegcamMotionRust.aex
            target/vfx-plugin/VfxPreview.ofx.bundle
            target/vfx-plugin/VfxPreview.dll
          if-no-files-found: error
